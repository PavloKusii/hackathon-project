      const list = Array.isArray(payload) ? payload : payload && Array.isArray(payload.scenarios) ? payload.scenarios : null;
      if (!list) {
        throw new Error("shape");
      }
      return list.filter((item) => item && item.id && item.title).map((item) => ({
        id: String(item.id),
        code: String(item.code || item.id),
        title: String(item.title),
        field: String(item.field || "Загальний модуль"),
        summary: String(item.summary || ""),
        norms: Array.isArray(item.norms) ? item.norms : [],
        steps: Array.isArray(item.steps) ? item.steps : []
      }));
    },
    builtin() {
      return BUILTIN_SCENARIOS;
    },
    async load(url) {
      const target = url || this.endpoint;
      const response = await fetch(target, { cache: "no-store" });
      if (!response.ok) {
        throw new Error(String(response.status));
      }
      const payload = await response.json();
      const pack = this.normalize(payload);
      if (!pack.length) {
        throw new Error("empty");
      }
      this.pack = pack;
      this.origin = target;
      return pack;
    }
  };

  function qrMarkup(code) {
    const size = 21;
    let seed = 2166136261;
    for (let index = 0; index < code.length; index += 1) {
      seed ^= code.charCodeAt(index);
      seed = Math.imul(seed, 16777619);
    }
    const bit = () => {
      seed = Math.imul(seed, 1664525) + 1013904223;
      return (seed >>> 24) & 1;
    };
    const finder = (x, y) => {
      const boxes = [[0, 0], [14, 0], [0, 14]];
      for (const [ox, oy] of boxes) {
        if (x >= ox && x < ox + 7 && y >= oy && y < oy + 7) {
          const lx = x - ox;
          const ly = y - oy;
          const edge = lx === 0 || ly === 0 || lx === 6 || ly === 6;
          const core = lx >= 2 && lx <= 4 && ly >= 2 && ly <= 4;
          return edge || core;
        }
      }
      return null;
    };
    let rects = "";
    for (let y = 0; y < size; y += 1) {
      for (let x = 0; x < size; x += 1) {
        const mark = finder(x, y);
        const on = mark === null ? bit() === 1 : mark;
        if (on) rects += `<rect x="${x}" y="${y}" width="1" height="1" fill="#18181b"></rect>`;
      }
    }
    return `<svg viewBox="0 0 21 21" class="h-40 w-40" role="img" aria-label="Навчальне зображення QR">${rects}</svg>`;
  }

  function makeCode() {
    const alphabet = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    const bytes = new Uint8Array(6);
    crypto.getRandomValues(bytes);
    let code = "";
    bytes.forEach((byte) => {
      code += alphabet[byte % alphabet.length];
    });
    return code;
  }

  function buildDistribution(options, pickedId, includeListener) {
    const weights = options.map((option, index) => {
      let weight = 3 + ((option.title.length + index * 5) % 4);
      if (option.id === pickedId) weight += 4;
      return weight;
    });
    const audience = 17;
    const weightSum = weights.reduce((sum, weight) => sum + weight, 0);
    const counts = weights.map((weight) => Math.max(1, Math.round((weight / weightSum) * audience)));
    counts[counts.length - 1] = Math.max(0, counts[counts.length - 1] + audience - counts.reduce((sum, count) => sum + count, 0));
    if (includeListener) {
      const index = Math.max(0, options.findIndex((option) => option.id === pickedId));
      counts[index] += 1;
    }
    const total = counts.reduce((sum, count) => sum + count, 0);
    const rows = options.map((option, index) => ({
      id: option.id,
      title: option.title,
      count: counts[index],
      pct: Math.round((counts[index] / total) * 100),
      yours: includeListener && option.id === pickedId
    }));
    rows[rows.length - 1].pct += 100 - rows.reduce((sum, row) => sum + row.pct, 0);
    return rows;
  }

  function ensureDistribution() {

    if (!state.distribution) {
      const picked = state.listenerVote || (options[0] && options[0].id) || "a";
      state.distribution = buildDistribution(options, picked, Boolean(state.listenerVote));
    }
    return state.distribution;
  }

  function viewSimulation() {
    const scenario = currentScenario();

      return `<p class="text-zinc-300">Кейс не містить кроку для проходження.</p>`;
    }
    const option = (step.options || []).find((item) => item.id === state.lockedOption);
    const last = state.stepIndex >= scenario.steps.length - 1;
    const cards = (step.options || []).map((item, index) => optionCard(item, index, "solo")).join("");
    const norms = (scenario.norms || []).map((norm) => `<span class="border border-zinc-800 px-2 py-1 font-mono text-[10px] uppercase tracking-[0.14em] text-zinc-400">${esc(normTitle(norm))}</span>`).join("");
    const feedback = state.revealed && option ? `
      <section id="feedback" class="rise mt-4 border border-olive-700 bg-zinc-900 p-5">
        <p class="font-mono text-[10px] uppercase tracking-[0.2em] text-olive-300">Миттєвий розбір</p>
        <h2 class="mt-2 font-display text-3xl tracking-wide text-zinc-50">Аналіз кроку</h2>
        <p class="mt-3 text-sm leading-7 text-zinc-300">${esc(option.analysis)}</p>
        <div class="mt-4 border border-zinc-800 bg-zinc-950 p-4">

          <span class="font-mono text-[10px] uppercase tracking-[0.16em] text-zinc-500">Зміна шкал</span>
          ${metricChips(option.deltas || {})}
        </div>
        <button type="button" data-action="next" class="mt-5 border border-olive-600 bg-olive-800 px-5 py-3 font-display text-xl tracking-[0.12em] text-olive-100 hover:border-olive-500 hover:bg-olive-700">${last ? "До підсумку" : "Наступний крок"}</button>
      </section>` : "";
    return `
      <div class="flex flex-wrap items-center justify-between gap-3">
        <button type="button" data-action="goto" data-screen="cases" class="border border-zinc-700 px-3 py-2 font-mono text-[10px] uppercase tracking-[0.16em] text-zinc-300 hover:border-olive-500">До списку кейсів</button>
        <p class="font-mono text-[11px] uppercase tracking-[0.18em] text-zinc-500">${esc(scenario.code)} · крок ${String(state.stepIndex + 1).padStart(2, "0")} / ${String(scenario.steps.length).padStart(2, "0")}</p>
      </div>
      <div class="mt-5 grid gap-6 lg:grid-cols-[minmax(0,1fr)_280px]">

          <div class="mt-3 flex flex-wrap gap-2">${norms}</div>
          <article class="mt-5 border border-zinc-800 bg-zinc-950/80 p-5">
            <p class="font-mono text-[10px] uppercase tracking-[0.18em] text-zinc-500">Ситуація</p>
            <p class="mt-3 text-base leading-7 text-zinc-200">${esc(step.prompt)}</p>

          <div class="mt-4 flex flex-col gap-3">${cards}</div>

      </div>`;

  function viewDebrief() {
    const scenario = currentScenario();
    if (!scenario) return "";
    const log = state.history.map((entry, index) => `
      <article class="border border-zinc-800 bg-zinc-950/70 p-4">
        <p class="font-mono text-[10px] uppercase tracking-[0.16em] text-zinc-500">Крок ${String(index + 1).padStart(2, "0")}</p>

        <p class="mt-2 text-sm leading-6 text-zinc-400">${esc(entry.option.analysis)}</p>
        <p class="mt-3 text-sm leading-6 text-zinc-300">${esc(entry.option.legal)}</p>
        <div class="mt-3 flex flex-wrap gap-3">${metricChips(entry.option.deltas || {})}</div>
      </article>`).join("");

      const href = normHref(norm);

      if (!href) return `<li class="text-sm text-zinc-300">${title}</li>`;
      return `<li><a class="text-sm text-amber-500/90 underline decoration-zinc-700 underline-offset-4 hover:text-amber-400" href="${esc(href)}" target="_blank" rel="noopener noreferrer">${title}</a></li>`;
    }).join("");
    const lines = posture(state.scores).map((line) => `<p class="text-sm leading-6 text-zinc-300">${esc(line)}</p>`).join("");
    return `
      <p class="font-mono text-[11px] uppercase tracking-[0.2em] text-olive-400">${esc(scenario.code)} · підсумок</p>
      <h1 class="mt-2 font-display text-4xl tracking-wide text-zinc-50 sm:text-5xl">Розбір проходження</h1>
      <p class="mt-3 max-w-3xl text-sm leading-6 text-zinc-400">${esc(scenario.title)}. Нижче фінальний баланс трьох шкал і правова опора обраних кроків.</p>
      <section class="mt-6 grid gap-4 border border-zinc-800 bg-zinc-900/80 p-5 sm:grid-cols-3">

        <button type="button" data-action="goto" data-screen="cases" class="border border-zinc-700 px-5 py-3 font-display text-xl tracking-[0.1em] text-zinc-200 hover:border-olive-500">Інший кейс</button>
        <button type="button" data-action="goto" data-screen="dashboard" class="border border-zinc-700 px-5 py-3 font-display text-xl tracking-[0.1em] text-zinc-200 hover:border-olive-500">На головну</button>
      </div>`;

    const options = state.scenarios.map((item) => `<option value="${esc(item.id)}" ${state.room && state.room.scenarioId === item.id ? "selected" : ""}>${esc(item.code)} · ${esc(item.title)}</option>`).join("");

    const panel = room ? `
      <section class="mt-5 grid gap-4 lg:grid-cols-[minmax(0,1fr)_auto]">

    return `
      <div class="flex flex-wrap items-end justify-between gap-4">

  function viewJoin() {
    const disabled = !state.room;
    return `
      <p class="font-mono text-[11px] uppercase tracking-[0.2em] text-olive-400">Слухач</p>
      <h1 class="mt-2 font-display text-4xl tracking-wide text-zinc-50 sm:text-5xl">Анонімний вхід</h1>
      <p class="mt-4 max-w-2xl text-sm leading-6 text-zinc-400">Ім’я не запитується і не зберігається. Потрібен лише код кімнати, який показав викладач.</p>
      <form data-form="join" class="mt-6 max-w-md border border-zinc-800 bg-zinc-900/80 p-5">

        <input id="room-code" name="code" maxlength="6" autocomplete="off" value="${esc(state.joinDraft === null && state.room ? state.room.code : state.joinDraft || "")}" class="mt-2 w-full border border-zinc-700 bg-zinc-950 px-3 py-3 font-mono text-2xl uppercase tracking-[0.28em] text-zinc-50" ${disabled ? "disabled" : ""}>
        <p class="mt-3 min-h-5 text-sm text-amber-400" aria-live="polite">${esc(state.joinError)}</p>
        <button type="submit" class="mt-2 border border-olive-600 bg-olive-800 px-5 py-3 font-display text-xl tracking-[0.1em] text-olive-100 hover:border-olive-500 hover:bg-olive-700" ${disabled ? "disabled" : ""}>Увійти анонімно</button>
      </form>
      <button type="button" data-action="goto" data-screen="teacher" class="mt-4 border border-zinc-700 px-3 py-2 font-mono text-[10px] uppercase tracking-[0.16em] text-zinc-300 hover:border-olive-500">До панелі викладача</button>`;

    const scenario = state.room && state.scenarios.find((item) => item.id === state.room.scenarioId);
    const step = scenario && scenario.steps && scenario.steps[0];
    if (!scenario || !step) return "";
    const cards = (step.options || []).map((item, index) => optionCard(item, index, "listener")).join("");
    const ready = state.listenerVote ? `<button type="button" data-action="goto" data-screen="votes" class="mt-4 border border-olive-600 bg-olive-800 px-5 py-3 font-display text-xl tracking-[0.1em] text-olive-100 hover:border-olive-500 hover:bg-olive-700">Показати розподіл</button>` : "";
    return `
      <p class="font-mono text-[11px] uppercase tracking-[0.2em] text-olive-400">Кімната ${esc(state.room.code)} · анонімно</p>
      <h1 class="mt-2 font-display text-4xl tracking-wide text-zinc-50 sm:text-5xl">${esc(scenario.title)}</h1>
      <p class="mt-3 max-w-3xl text-sm leading-6 text-zinc-400">Груповий режим фіксує лише знеособлений вибір першого кроку. Особисті шкали тренажера тут не змінюються.</p>
      <article class="mt-5 border border-zinc-800 bg-zinc-950/80 p-5">
        <p class="font-mono text-[10px] uppercase tracking-[0.18em] text-zinc-500">Ситуація для аудиторії</p>
        <p class="mt-3 text-base leading-7 text-zinc-200">${esc(step.prompt)}</p>
      </article>
      <div class="mt-4 flex flex-col gap-3">${cards}</div>
      ${ready}`;
  }

  function viewVotes() {
    const scenario = state.room && state.scenarios.find((item) => item.id === state.room.scenarioId);
    const rows = ensureDistribution();
    const note = state.listenerVote ? "У розподілі є відповідь цього сеансу і змодельовані голоси решти аудиторії." : "Живу відповідь ще не передано. Показано змодельований розподіл для підготовки до заняття.";
    const bars = rows.map((row) => `
      <div class="border ${row.yours ? "border-amber-700" : "border-zinc-800"} bg-zinc-950 p-4">
        <div class="flex items-start justify-between gap-3">
          <p class="text-sm text-zinc-200">${esc(row.title)}</p>
          <p class="font-mono text-sm text-zinc-300">${row.pct}%</p>

        <div class="mt-3 h-2 bg-zinc-800">
          <div class="bar-fill h-2 ${row.yours ? "bg-amber-500" : "bg-olive-500"}" style="width:${Math.max(0, row.pct)}%"></div>
        </div>
        <p class="mt-2 font-mono text-[10px] uppercase tracking-[0.14em] text-zinc-500">Відповідей: ${row.count}${row.yours ? " · ваш вибір" : ""}</p>
      </div>`).join("");
    return `
      <p class="font-mono text-[11px] uppercase tracking-[0.2em] text-olive-400">Аудиторія ${state.room ? esc(state.room.code) : ""}</p>
      <h1 class="mt-2 font-display text-4xl tracking-wide text-zinc-50 sm:text-5xl">Розподіл голосів</h1>

        <button type="button" data-action="goto" data-screen="teacher" class="border border-olive-600 bg-olive-800 px-5 py-3 font-display text-xl tracking-[0.1em] text-olive-100 hover:border-olive-500 hover:bg-olive-700">Панель викладача</button>
        <button type="button" data-action="goto" data-screen="ballot" class="border border-zinc-700 px-5 py-3 font-display text-xl tracking-[0.1em] text-zinc-200 hover:border-olive-500">Картки слухача</button>
      </div>`;

  function render() {
    if ((state.screen === "simulation" || state.screen === "debrief") && !currentScenario()) {
      state.screen = "cases";
    }
    if ((state.screen === "votes" || state.screen === "ballot") && !state.room) {
      state.screen = "teacher";
    }
    if (state.screen === "ballot" && !state.admitted) {
      state.screen = "join";
    }
    const views = {
      dashboard: viewDashboard,
      library: viewLibrary,
      cases: viewCases,
      simulation: viewSimulation,
      debrief: viewDebrief,
      teacher: viewTeacher,
      join: viewJoin,
      ballot: viewBallot,
      votes: viewVotes
    };
    const view = views[state.screen] || viewDashboard;
    document.getElementById("app").innerHTML = shell(view());
  }

  function openCase(id) {
    const scenario = state.scenarios.find((item) => item.id === id);
    if (!scenario || !scenario.steps || !scenario.steps.length) {
      state.loadNote = "У цьому записі ще немає кроків симуляції.";
      state.screen = "cases";
      render();
      return;
    }
    state.scenarioId = id;
    resetRun();
    state.screen = "simulation";
    render();
    window.scrollTo(0, 0);
  }

  function choose(optionId) {
    if (state.revealed) return;
    const step = currentStep();
    if (!step) return;
    const option = (step.options || []).find((item) => item.id === optionId);
    if (!option) return;
    state.lockedOption = optionId;
    state.revealed = true;
    METRICS.forEach((metric) => {
      const delta = Number((option.deltas || {})[metric.key] || 0);
      state.scores[metric.key] = clamp(state.scores[metric.key] + delta);
    });
    state.history.push({ option });
    render();
    const feedback = document.getElementById("feedback");
    if (feedback) feedback.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  function nextStep() {
    const scenario = currentScenario();
    const step = currentStep();
    if (!scenario || !step || !state.revealed) return;
    if (state.stepIndex >= scenario.steps.length - 1) {
      state.finished = true;
      state.screen = "debrief";
      render();
      window.scrollTo(0, 0);
      return;
    }
    state.stepIndex += 1;
    state.lockedOption = null;
    state.revealed = false;
    render();
    window.scrollTo(0, 0);
  }

  async function loadScenarios() {
    if (state.loading) return;
    state.loading = true;
    state.loadNote = "Зчитування scenarios.json…";
    render();
    try {
      const pack = await ScenarioLoader.load();
      state.scenarios = pack;
      state.loadNote = `Завантажено ${pack.length} сценаріїв із ${ScenarioLoader.origin}.`;
    } catch (error) {
      state.scenarios = ScenarioLoader.builtin();
      state.loadNote = "Зовнішній файл зараз недоступний. На екрані лишається вбудований набір прототипу.";
    }
    state.loading = false;
    render();
  }

  function createRoom() {
    const select = document.getElementById("scenario-pick");
    const scenarioId = select ? select.value : state.scenarios[0] && state.scenarios[0].id;
    state.room = {
      code: makeCode(),
      scenarioId,
      clock: new Date().toLocaleTimeString("uk-UA", { hour: "2-digit", minute: "2-digit" })
    };
    state.admitted = false;
    state.listenerVote = null;
    state.distribution = null;
    state.joinError = "";
    state.joinDraft = null;
    state.copyNote = "Код готовий до показу аудиторії.";
    render();
  }

  async function copyCode() {
    if (!state.room) return;
    try {
      await navigator.clipboard.writeText(state.room.code);
      state.copyNote = "Код скопійовано.";
    } catch (error) {
      state.copyNote = "Скопіюйте код із великого рядка.";
    }
    render();
  }

  function onClick(event) {
    const node = event.target.closest("[data-action]");
    if (!node) return;
    const action = node.dataset.action;
    if (action === "goto") {
      state.screen = node.dataset.screen;
      render();
      window.scrollTo(0, 0);
      return;
    }
    if (action === "open") {
      openCase(node.dataset.id);
      return;
    }
    if (action === "choose") {
      choose(node.dataset.id);
      return;
    }
    if (action === "listener") {
      if (state.listenerVote) return;
      state.listenerVote = node.dataset.id;
      state.distribution = null;
      render();
      return;
    }
    if (action === "next") {
      nextStep();
      return;
    }
    if (action === "load") {
      loadScenarios();
      return;
    }
    if (action === "create-room") {
      createRoom();
      return;
    }
    if (action === "copy") {
      copyCode();
      return;
    }
    if (action === "admit") {
      state.joinError = "";
      state.joinDraft = null;
      state.screen = "join";
      render();
      window.scrollTo(0, 0);
      return;
    }
    if (action === "resume") {
      state.screen = "simulation";
      render();
      window.scrollTo(0, 0);
      return;
    }
    if (action === "restart") {
      const id = state.scenarioId;
      resetRun();
      state.scenarioId = id;
      state.screen = "simulation";
      render();
      window.scrollTo(0, 0);
    }
  }

  function onSubmit(event) {
    const form = event.target.closest("[data-form]");
    if (!form) return;
    event.preventDefault();
    if (form.dataset.form !== "join") return;
    const code = String(form.code.value || "").trim().toUpperCase();
    state.joinDraft = code;
    if (!state.room) {
      state.joinError = "Спочатку створіть кімнату в режимі викладача.";
      render();
      return;
    }
    if (code !== state.room.code) {
      state.joinError = "Код не збігається з активною кімнатою цього сеансу.";
      state.admitted = false;
      render();
      return;
    }
    state.joinError = "";
    state.admitted = true;
    state.screen = "ballot";
    render();
    window.scrollTo(0, 0);
  }

  const root = document.getElementById("app");
  root.addEventListener("click", onClick);
  root.addEventListener("submit", onSubmit);
  render();
})();
</script>
</body>
</html>
